<!DOCTYPE html>
<html>
<head>
  <title>Safe Mail Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginBox">
  <h2>Login</h2>
  <input id="user" placeholder="ID">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="appBox" style="display:none;">
  <div class="container">

    <h2>Safe Mail Launcher</h2>

    <input id="sender" placeholder="Sender Name"><br><br>
    <input id="email" placeholder="Gmail"><br><br>
    <input id="password" type="password" placeholder="App Password"><br><br>
    <input id="subject" placeholder="Subject"><br><br>

    <textarea id="message" rows="5"></textarea><br><br>
    <textarea id="recipients" rows="5"></textarea><br><br>

    <button id="sendBtn" onclick="sendAll()">Send All</button>
    <button ondblclick="logout()">Logout</button>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
