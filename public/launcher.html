<!DOCTYPE html>
<html>
<head>
  <title>Safe Mail Launcher</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f7;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    textarea {
      height: 150px;
      resize: none;
    }

    .full {
      grid-column: span 2;
    }

    .btn {
      width: 80%;
      padding: 15px;
      background: linear-gradient(to right, #4a7cff, #3b6be0);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .logout {
      width: 120px;
      padding: 12px;
      background: #4a7cff;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .note {
      font-size: 12px;
      color: #666;
      text-align: right;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📨 Safe ( YATENDRA ) Mail Launcher</h1>

  <div class="grid">
    <input id="sender" placeholder="Sender Name">
    <input id="email" placeholder="Your Gmail">

    <input id="password" placeholder="App Password">
    <input id="subject" placeholder="Subject">

    <textarea id="message" class="full" placeholder="Message Body"></textarea>
    <textarea id="recipients" class="full" placeholder="Recipients (comma or newline)"></textarea>
  </div>

  <div class="footer">
    <button class="btn" onclick="sendAll()">Send All</button>

    <div>
      <button class="logout" onclick="logout()">Logout</button>
      <div class="note">Double-click to logout</div>
    </div>
  </div>
</div>

<script>
// 🔐 LOGIN (hidden prompt same style)
const USER = "2026";
const PASS = "2026";

if (!localStorage.getItem("auth")) {
  const u = prompt("Enter ID:");
  const p = prompt("Enter Password:");

  if (u === USER && p === PASS) {
    localStorage.setItem("auth", "1");
  } else {
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:100px;'>Access Denied</h2>";
    throw new Error("Blocked");
  }
}

// 🔴 DOUBLE CLICK LOGOUT
let clicks = 0;
function logout() {
  clicks++;
  if (clicks === 1) {
    setTimeout(() => clicks = 0, 400);
  } else {
    localStorage.removeItem("auth");
    location.reload();
  }
}

// 📩 SEND
async function sendAll() {
  const data = {
    sender: sender.value,
    email: email.value,
    password: password.value,
    subject: subject.value,
    message: message.value,
    recipients: recipients.value,
  };

  const res = await fetch("/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(result.message);
}
</script>

</body>
</html>
