<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safe Mail Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>📨 Safe ( YATENDRA ) Mail Launcher</h1>

    <div class="grid">

      <!-- LEFT -->
      <input type="text" id="sender" placeholder="Sender Name">
      <input type="email" id="email" placeholder="Your Gmail">

      <input type="password" id="password" placeholder="App Password">
      <input type="text" id="subject" placeholder="Subject">

      <!-- MESSAGE -->
      <textarea id="message" placeholder="Message Body" class="full"></textarea>

      <!-- RECIPIENTS -->
      <textarea id="recipients" placeholder="Recipients (comma or newline)" class="full"></textarea>

    </div>

    <div class="footer">
      <button class="btn" onclick="sendAll()">Send All</button>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <p style="text-align:center; margin-top:10px; font-size:12px; color:#666;">
      Double-click logout for security
    </p>

  </div>

  <script src="script.js"></script>

</body>
</html>
