<!DOCTYPE html>
<html>
<head>
  <title>Mail Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login">
  <h2>Login</h2>
  <input id="u" placeholder="ID">
  <input id="p" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="app" style="display:none;">
  <div class="container">
    <h1>Safe Mail Launcher</h1>

    <div class="grid">
      <input id="sender" placeholder="Sender">
      <input id="email" placeholder="Gmail">
      <input id="password" placeholder="App Password">
      <input id="subject" placeholder="Subject">
      <textarea id="message" class="full"></textarea>
      <textarea id="recipients" class="full"></textarea>
    </div>

    <button onclick="sendAll()" class="btn">Send</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
