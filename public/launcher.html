<!DOCTYPE html>
<html>
<head>
  <title>Safe Mail Launcher</title>
  <style>
    body { margin:0; font-family:Arial; background:#eef2f7; }

    .container {
      max-width:900px; margin:60px auto; background:#fff;
      padding:30px; border-radius:15px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    h1 { text-align:center; margin-bottom:30px; }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    input,textarea {
      width:100%; padding:12px;
      border-radius:10px; border:1px solid #ccc;
    }

    textarea { height:180px; }

    .footer {
      display:flex; justify-content:space-between;
      margin-top:20px;
    }

    .btn {
      padding:15px; width:80%;
      background:#4a7cff; color:#fff;
      border:none; border-radius:10px;
    }

    .login-box {
      width:300px; margin:150px auto;
      background:#fff; padding:20px;
      text-align:center; border-radius:10px;
    }
  </style>
</head>

<body>

<div id="loginBox" class="login-box">
  <h2>Login</h2>
  <input id="user" placeholder="ID">
  <input id="pass" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<div id="appBox" style="display:none;">
  <div class="container">
    <h1>📧 Safe Mail Launcher</h1>

    <div class="grid">
      <input id="sender" placeholder="Sender Name">
      <input id="email" placeholder="Your Gmail">

      <input id="password" type="password" placeholder="App Password">
      <input id="subject" placeholder="Subject">

      <textarea id="message" placeholder="Message"></textarea>
      <textarea id="recipients" placeholder="Recipients"></textarea>
    </div>

    <div class="footer">
      <button id="sendBtn" class="btn" onclick="sendAll()">Send All</button>
    </div>
  </div>
</div>

<script>
const USER="2026", PASS="2026";

function login(){
  if(user.value===USER && pass.value===PASS){
    localStorage.setItem("auth","1");
    show();
  } else alert("Wrong Login");
}

function show(){
  loginBox.style.display="none";
  appBox.style.display="block";
}

window.onload=()=>{
  if(localStorage.getItem("auth")) show();
};

async function sendAll(){

  const btn=document.getElementById("sendBtn");

  const list=recipients.value.split(/[\n,]+/).filter(Boolean);

  if(list.length===0) return alert("Add recipients");
  if(list.length>27) return alert("Limit 27/hour");

  btn.disabled=true;
  btn.innerText="Sending...";

  const res=await fetch("/send",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      sender:sender.value,
      email:email.value,
      password:password.value,
      subject:subject.value,
      message:message.value,
      recipients:recipients.value
    })
  });

  const r=await res.json();

  alert(r.success ? "Sent - "+r.count : r.message);

  btn.disabled=false;
  btn.innerText="Send All";
}
</script>

</body>
</html>
