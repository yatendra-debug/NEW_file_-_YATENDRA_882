<script>
const USER = "2026";
const PASS = "2026";

// 🔐 LOGIN
function login() {
  if (user.value === USER && pass.value === PASS) {
    localStorage.setItem("auth", "1");
    showApp();
  } else {
    alert("Wrong Login");
  }
}

function showApp() {
  loginBox.style.display = "none";
  appBox.style.display = "block";
}

window.onload = () => {
  if (localStorage.getItem("auth") === "1") showApp();
};

// 🔴 LOGOUT (DOUBLE CLICK)
let clicks = 0;
function logout() {
  clicks++;
  if (clicks === 1) {
    setTimeout(() => clicks = 0, 400);
  } else {
    localStorage.removeItem("auth");
    location.reload();
  }
}

// 🔥 SAFE SEND FUNCTION (LIMIT + BUTTON CONTROL)
async function sendAll() {

  const btn = document.querySelector(".btn");

  // 🔥 get email list
  const list = recipients.value
    .split(/[\n,]+/)
    .map(e => e.trim())
    .filter(Boolean);

  // 🔥 FRONTEND LIMIT (MAX 27)
  if (list.length === 0) {
    alert("Add recipients");
    return;
  }

  if (list.length > 27) {
    alert("Limit is 27 emails per hour");
    return;
  }

  // disable button
  btn.disabled = true;
  btn.innerText = "Sending...";

  try {
    const res = await fetch("/send", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        sender: sender.value,
        email: email.value,
        password: password.value,
        subject: subject.value,
        message: message.value,
        recipients: recipients.value,
      })
    });

    const result = await res.json();

    // backend error (wrong password)
    if (!result.success) {
      alert(result.message);
    } else {
      alert("Sent - " + result.count);
    }

  } catch (e) {
    alert("Server error");
  }

  // enable again
  btn.disabled = false;
  btn.innerText = "Send All";
}
</script>
