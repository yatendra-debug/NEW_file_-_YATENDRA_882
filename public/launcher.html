<!DOCTYPE html>
<html>
<head>
  <title>Safe Mail Launcher</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f7;
    }

    .container {
      max-width: 1000px; /* 🔥 container bada */
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px; /* 🔥 size bada */
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    textarea {
      height: 160px;
      resize: none;
    }

    .full {
      grid-column: span 2;
    }

    .btn {
      width: 80%;
      padding: 16px;
      background: linear-gradient(to right, #4a7cff, #3b6be0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .logout {
      width: 130px;
      padding: 14px;
      background: #4a7cff;
      color: #fff;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
    }

    .note {
      font-size: 12px;
      color: #666;
      text-align: right;
    }

    /* 🔐 login */
    .login-box {
      width: 300px;
      margin: 150px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>Login</h2>
  <input id="user" placeholder="Enter ID">
  <input id="pass" type="password" placeholder="Enter Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="appBox" style="display:none;">
  <div class="container">
    <h1>📨 Safe ( YATENDRA ) Mail Launcher</h1>

    <div class="grid">
      <!-- 🔥 TOP 4 BIG FIELDS -->
      <input id="sender" placeholder="Sender Name">
      <input id="email" placeholder="Your Gmail">

      <input id="password" placeholder="App Password">
      <input id="subject" placeholder="Subject">

      <!-- TEXT AREAS -->
      <textarea id="message" class="full" placeholder="Message Body"></textarea>
      <textarea id="recipients" class="full" placeholder="Recipients (comma or newline)"></textarea>
    </div>

    <div class="footer">
      <button class="btn" onclick="sendAll()">Send All</button>

      <div>
        <button class="logout" onclick="logout()">Logout</button>
        <div class="note">Double-click to logout</div>
      </div>
    </div>
  </div>
</div>

<script>
const USER = "2026";
const PASS = "2026";

function login() {
  const u = user.value.trim();
  const p = pass.value.trim();

  if (u === USER && p === PASS) {
    localStorage.setItem("auth", "1");
    showApp();
  } else {
    alert("Wrong Login");
  }
}

function showApp() {
  loginBox.style.display = "none";
  appBox.style.display = "block";
}

window.onload = () => {
  if (localStorage.getItem("auth") === "1") showApp();
};

let clicks = 0;
function logout() {
  clicks++;
  if (clicks === 1) {
    setTimeout(() => clicks = 0, 400);
  } else {
    localStorage.removeItem("auth");
    location.reload();
  }
}

async function sendAll() {
  const data = {
    sender: sender.value,
    email: email.value,
    password: password.value,
    subject: subject.value,
    message: message.value,
    recipients: recipients.value,
  };

  const res = await fetch("/send", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(result.message);
}
</script>

</body>
</html>
