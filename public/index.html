<!DOCTYPE html>
<html>
<head>
  <title>Fast Mail Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>📧 Fast Mail Launcher</h2>

  <div class="grid">
    <input id="name" placeholder="Sender Name">
    <input id="email" placeholder="Your Gmail">

    <input id="pass" placeholder="App Password">
    <input id="subject" placeholder="Subject">

    <textarea id="message" placeholder="Message Body"></textarea>
    <textarea id="recipients" placeholder="Recipients"></textarea>
  </div>

  <button onclick="sendMail()">Send All</button>
  <button ondblclick="logout()">Logout</button>
  <p>Double-click to logout</p>
</div>

<script src="script.js"></script>
</body>
</html>
