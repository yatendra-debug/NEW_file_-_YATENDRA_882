<!DOCTYPE html>
<html>
<head>
  <title>Fast Mail Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>📧 Fast Mail Launcher</h2>

  <div class="grid">
    <input id="name" placeholder="Sender Name">
    <input id="email" placeholder="Your Gmail">

    <input id="pass" type="password" placeholder="App Password">
    <input id="subject" placeholder="Subject">

    <textarea id="message" placeholder="Message Body"></textarea>
    <textarea id="recipients" placeholder="Recipients"></textarea>
  </div>

  <div class="btn-row">
    <button class="send-btn" onclick="sendMail()">Send All</button>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </div>

  <small>Double-click to logout</small>
</div>

<script src="script.js"></script>
</body>
</html>
