<!DOCTYPE html>
<html>
<head>
  <title>Safe Mail Launcher</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
    }
    .box {
      width: 700px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 45%;
      margin: 10px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    textarea {
      height: 120px;
    }
    button {
      width: 90%;
      padding: 15px;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>( YATENDRA )</h2>

  <input id="sender" placeholder="Sender Name">
  <input id="subject" placeholder="Subject"><br>

  <textarea id="message" placeholder="Message Body"></textarea>
  <textarea id="recipients" placeholder="Recipients (comma or new line)"></textarea><br>

  <button onclick="send()">Send All</button>
</div>

<script>
async function send() {
  const data = {
    sender: sender.value,
    subject: subject.value,
    message: message.value,
    recipients: recipients.value
  };

  const res = await fetch("/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(result.success ? "Sent ✅" : result.error);
}
</script>

</body>
</html>
