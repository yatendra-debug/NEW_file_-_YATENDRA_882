<!DOCTYPE html>
<html>
<head>
  <title>Safe Launcher</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; text-align:center; }
    .box { width:700px; margin:50px auto; padding:20px; background:#fff; border-radius:10px; }
    input, textarea { width:45%; margin:10px; padding:10px; }
    textarea { height:100px; }
    button { padding:15px 40px; background:blue; color:white; border:none; border-radius:8px; }
  </style>
</head>
<body>

<div class="box">
  <h2>( YATENDRA )</h2>

  <input id="sender" placeholder="Sender Name">
  <input id="email" placeholder="Your Gmail"><br>

  <input id="pass" placeholder="App Password">
  <input id="subject" placeholder="Subject"><br>

  <textarea id="message" placeholder="Message Body"></textarea>
  <textarea id="recipients" placeholder="Recipients"></textarea><br>

  <button onclick="send()">Send All</button>
</div>

<script>
async function send() {
  const data = {
    sender: sender.value,
    email: email.value,
    pass: pass.value,
    subject: subject.value,
    message: message.value,
    recipients: recipients.value
  };

  const res = await fetch("/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(result.success ? "Sent ✅" : result.error);
}
</script>

</body>
</html>
